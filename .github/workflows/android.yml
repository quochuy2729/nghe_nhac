name: Build Android APK

on:
  push:
    branches: [main, 'phase/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # đính APK vào Release khi push tag v*

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm run lint
      - run: npm run test

      - name: Build web bundle + cap sync
        run: npm run build:android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Cùng một keystore cho mọi bản build thì cài đè bản mới lên bản cũ không bị lỗi chữ ký.
      - name: Decode keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Thiếu secret ANDROID_KEYSTORE_B64 — APK sẽ KHÔNG được ký nên không cài được lên điện thoại."
          fi

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('0.0.{0}', github.run_number) }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      # Log Actions cần đăng nhập mới đọc được; annotation thì xem công khai được → in lỗi biên dịch ra đó.
      - name: Surface Gradle errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed|FAILED|Caused by|^> " "$RUNNER_TEMP/gradle.log" | head -40 | while IFS= read -r l; do echo "::error::${l:0:900}"; done

      - uses: actions/upload-artifact@v4
        with:
          name: nghe-nhac-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/*.apk
